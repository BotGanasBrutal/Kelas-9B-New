<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Kelas 9B — Hutan Pagi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@300;700&display=swap');
  :root{
    --sky:#bfeaf2; --sun:#ffd94d; --leaf:#3f8a3f; --mid:#7fbf6f; --panel:rgba(255,255,255,0.06);
  }
  html,body{height:100%;margin:0;font-family:'Merriweather',serif;background:
    linear-gradient(180deg,var(--sky) 0%, #d1f0d9 45%, #eaf7e8 100%); color:#123; overflow:hidden;}
  .forest-bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
  /* soft layered trees */
  .forest-bg::before,.forest-bg::after{content:"";position:absolute;inset:0;background-repeat:no-repeat;background-position:bottom;opacity:0.95}
  .forest-bg::before{background-image:
    radial-gradient(500px 240px at 8% 80%, rgba(30,90,40,0.95), transparent 30%),
    radial-gradient(420px 220px at 30% 84%, rgba(40,110,50,0.95), transparent 36%),
    radial-gradient(520px 260px at 70% 88%, rgba(20,80,30,0.93), transparent 30%);
    filter: blur(2px); transform:translateY(2%);}
  .forest-bg::after{background-image:
    radial-gradient(220px 120px at 85% 86%, rgba(30,100,45,0.8), transparent 40%),
    radial-gradient(160px 110px at 50% 90%, rgba(18,70,28,0.8), transparent 45%);
    filter: blur(6px); transform:translateY(8%); opacity:0.9;}
  /* sun */
  .sun{position:fixed; right:6%; top:6%; width:100px; height:100px; border-radius:50%; background:radial-gradient(circle,#fffabb,#ffd94d 50%, #ffc138 100%); box-shadow:0 12px 60px rgba(255,210,100,0.35); z-index:0; pointer-events:none;}
  /* bird */
  .bird{position:fixed; left:-20%; top:12vh; width:120px; height:64px; z-index:2; pointer-events:none; animation:fly 14s linear infinite;}
  @keyframes fly {0%{transform:translateX(-20vw) translateY(0)}50%{transform:translateX(40vw) translateY(-6vh)}100%{transform:translateX(140vw) translateY(0)}}
  /* leaves container */
  #leaves{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .leaf{position:absolute;width:22px;height:22px;will-change:transform,opacity;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.15))}
  /* UI */
  .wrap{position:relative;z-index:3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
  .card{width:100%;max-width:820px;background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.75));border-radius:14px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,0.12);border:1px solid rgba(0,0,0,0.06)}
  h1{margin:0;color:#123; font-size:26px}
  p.lead{color:#234;opacity:0.9;margin:8px 0 16px}
  .menu{display:flex;gap:10px;flex-wrap:wrap}
  .btn{background:linear-gradient(180deg,#ffffff,#f0fff0);border:1px solid rgba(0,0,0,0.06);padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
  .btn:hover{transform:translateY(-6px)}
  footer{margin-top:12px;color:#356; font-size:14px}
  @media(max-width:480px){ .card{padding:16px} .btn{padding:10px 12px;font-size:14px} h1{font-size:20px} }
</style>
</head>
<body>
  <div class="forest-bg" aria-hidden="true"></div>
  <div class="sun" aria-hidden="true"></div>

  <!-- bird SVG -->
  <div class="bird" aria-hidden="true">
    <svg viewBox="0 0 80 40" width="100%" height="100%"><path d="M4 24c8-8 16-8 28-2 8 4 16 4 28-6 0 0 10 14 22 14-14 10-36 12-60-6z" fill="#2d4f2d"/></svg>
  </div>

  <div id="leaves"></div>

  <div class="wrap">
    <div class="card">
      <h1>KELAS 9B — Tema Hutan (Pagi Cerah)</h1>
      <p class="lead">Selamat datang! Pilih menu — Kelas paling ramah. Nikmati suasana pagi di hutan 🌤️🌿</p>

      <div class="menu">
        <button class="btn" onclick="openPage('siswa.html')">Daftar Siswa</button>
        <button class="btn" onclick="openPage('struktur.html')">Struktur Kelas</button>
        <button class="btn" onclick="openPage('piket.html')">Jadwal Piket</button>
        <button class="btn" onclick="openPage('pelajaran.html')">Jadwal Pelajaran</button>
      </div>

      <footer>© Kelas 9B • Tema Hutan Pagi</footer>
    </div>
  </div>

<script>
  function openPage(path){ window.open(path, '_blank'); }

  // falling leaves (gentle, suitable for mobile)
  (function(){
    const container = document.getElementById('leaves');
    const leafSVG = (color, rot) => `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 12c4-6 9-8 20-10-3 9-6 14-10 18-4-3-8-6-10-8z" fill="${color}" transform="rotate(${rot})"/></svg>`;
    function makeLeaf(){
      const el = document.createElement('div'); el.className='leaf';
      const size = Math.random()*18 + 14;
      el.style.width = el.style.height = size+'px';
      el.style.left = Math.random()*110 + '%';
      el.style.top = '-8%';
      const color = Math.random()>0.5 ? '#3f8a3f' : '#7fbf6f';
      el.innerHTML = leafSVG(color, Math.floor(Math.random()*360));
      container.appendChild(el);
      const duration = Math.random()*9000 + 8000;
      const endX = (Math.random()*140 - 20);
      el.animate([
        { transform: `translate3d(0,0,0) rotate(${Math.random()*360}deg)`, opacity:1 },
        { transform: `translate3d(${endX}vw, 110vh, 0) rotate(${Math.random()*720}deg)`, opacity:0.9 }
      ], { duration: duration, easing:'linear' });
      setTimeout(()=> el.remove(), duration + 200);
    }
    const interval = /Mobi/.test(navigator.userAgent) ? 700 : 420;
    setInterval(makeLeaf, interval);
    for(let i=0;i<6;i++) setTimeout(makeLeaf, i*180);
  })();
</script>
</body>
</html>
