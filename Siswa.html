<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Daftar Siswa 9B</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@300;700&display=swap');
  :root{--bg:#eaf7e8; --leaf:#3f8a3f;}
  html,body{height:100%;margin:0;background:linear-gradient(180deg,#dff6f0,#eaf7e8);font-family:'Merriweather',serif;color:#123;}
  .back{position:fixed;left:12px;top:12px;z-index:10}
  .back button{padding:8px 10px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);background:#fff;cursor:pointer}
  .wrap{padding:14px;max-width:980px;margin:60px auto 40px;position:relative;z-index:2}
  .card{background:white;border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
  h1{margin:0 0 8px}
  .desc{margin:0 0 12px;color:#355}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px;border-bottom:1px solid rgba(0,0,0,0.06);text-align:left}
  th{background:#f5fff8;color:#1b4}
  td.name{cursor:pointer}
  td.name[contenteditable="true"]{outline:2px dashed rgba(60,120,60,0.2)}
  .hint{font-size:13px;color:#446;margin-top:8px}
  footer{margin-top:10px;color:#355}
  @media(max-width:520px){ .wrap{padding:12px} td{padding:8px} }
</style>
</head>
<body>
  <div class="back"><button onclick="goHome()">← Kembali ke Beranda</button></div>

  <div class="wrap">
    <div class="card">
      <h1>Daftar Siswa Kelas 9B</h1>
      <p class="desc">Klik dua kali pada nama untuk mengedit. Perubahan akan otomatis tersimpan di perangkat (localStorage).</p>

      <table id="table">
        <thead><tr><th>No</th><th>Nama</th><th>Jenis Kelamin</th></tr></thead>
        <tbody></tbody>
      </table>

      <p class="hint">Tip: setelah edit, tekan Enter atau ketuk di luar untuk menyimpan.</p>
      <footer>Data tersimpan otomatis di browser</footer>
    </div>
  </div>

<script>
  function goHome(){ window.location.href = 'index.html'; }

  // default students
  const defaultStudents = [
    {name:'Andi Pratama', gender:'Laki-laki'},
    {name:'Bunga Cahaya', gender:'Perempuan'},
    {name:'Dedi Saputra', gender:'Laki-laki'},
    {name:'Fitri Ayu', gender:'Perempuan'},
    {name:'Galih Ramadhan', gender:'Laki-laki'},
    {name:'Putra Adi', gender:'Laki-laki'},
    {name:'Rani Dewi', gender:'Perempuan'},
    {name:'Riko Saputra', gender:'Laki-laki'},
    {name:'Sinta Marlina', gender:'Perempuan'},
    {name:'Yusuf Fadillah', gender:'Laki-laki'},
    {name:'Putri Nabila', gender:'Perempuan'},
    {name:'Andra Kurnia', gender:'Laki-laki'},
    {name:'Dewi Kartika', gender:'Perempuan'},
    {name:'Rama Dwi', gender:'Laki-laki'},
    {name:'Tia Salsabila', gender:'Perempuan'},
    {name:'Bagas Mahendra', gender:'Laki-laki'},
    {name:'Rizky Arif', gender:'Laki-laki'},
    {name:'Citra Melani', gender:'Perempuan'},
    {name:'Hafidz Rahman', gender:'Laki-laki'},
    {name:'Nadia Wulandari', gender:'Perempuan'},
    {name:'Reza Putra', gender:'Laki-laki'},
    {name:'Linda Puspita', gender:'Perempuan'},
    {name:'Gina Oktaviani', gender:'Perempuan'},
    {name:'Yoga Prasetyo', gender:'Laki-laki'},
    {name:'Alya Khairunisa', gender:'Perempuan'},
    {name:'Dika Pratomo', gender:'Laki-laki'},
    {name:'Rizka Amelia', gender:'Perempuan'},
    {name:'Faiz Ananda', gender:'Laki-laki'},
    {name:'Salsa Nurfadila', gender:'Perempuan'},
    {name:'Farhan Hidayat', gender:'Laki-laki'},
    {name:'Vina Permata', gender:'Perempuan'},
    {name:'Rafli Firmansyah', gender:'Laki-laki'}
  ];

  const STORAGE_KEY = 'kelas9b_students_v1';

  function loadStudents(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{ const parsed = JSON.parse(raw); if(Array.isArray(parsed)) return parsed; }
      catch(e){}
    }
    // first time: seed defaults
    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultStudents));
    return defaultStudents.slice();
  }

  function saveStudents(arr){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  function renderTable(){
    const tbody = document.querySelector('#table tbody');
    tbody.innerHTML = '';
    students.forEach((s,i)=>{
      const tr = document.createElement('tr');
      const tdNo = document.createElement('td'); tdNo.textContent = i+1;
      const tdName = document.createElement('td'); tdName.className='name'; tdName.textContent = s.name;
      const tdGen = document.createElement('td'); tdGen.textContent = s.gender;
      // make name editable on double click
      tdName.addEventListener('dblclick', ()=> enableEdit(tdName, i));
      tr.appendChild(tdNo); tr.appendChild(tdName); tr.appendChild(tdGen);
      tbody.appendChild(tr);
    });
  }

  function enableEdit(cell, index){
    if(cell.getAttribute('contenteditable') === 'true') return;
    cell.setAttribute('contenteditable','true');
    cell.focus();
    // place caret at end
    document.execCommand('selectAll', false, null);
    document.getSelection().collapseToEnd();

    function finish(){
      cell.removeAttribute('contenteditable');
      const newVal = cell.textContent.trim() || defaultStudents[index].name;
      students[index].name = newVal;
      saveStudents(students);
      renderTable(); // re-render to refresh numbering & listeners
    }
    // save on blur or Enter
    cell.addEventListener('blur', finish, {once:true});
    cell.addEventListener('keydown', function onKey(e){
      if(e.key === 'Enter'){ e.preventDefault(); finish(); }
    });
  }

  const students = loadStudents();
  renderTable();

  // optional: allow swipe down to reset? (not needed)
</script>
</body>
</html>
